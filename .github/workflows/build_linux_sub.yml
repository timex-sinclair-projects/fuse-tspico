# Reusable workflow for all Linux builds
name: Fuse App For Linux
run-name: Build Fuse App for Linux / ${{ github.actor }} /

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      dependencies:
        type: string
        required: false
        default: ""
      configure_params:
        type: string
        required: false
        default: ""
      libspectrum_key:
        type: string
        required: false
        default: "fuse-app"
      verify_ui:
        type: string
        required: true
      verify_audio:
        type: string
        required: false
        default: "oss"
      verify_other:
        type: string
        required: false
        default: ""
      run_check:
        type: boolean
        required: false
        default: false
      tspico_test:
        # Run tspico/bridge_test.py (the TS-Pico interface against a stand-in
        # bridge); needs a build configured with --enable-automation
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: (1) Install dependencies
        if: ${{ inputs.dependencies }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.dependencies }}

      - name: (2) Check out repository code
        uses: actions/checkout@v7

      - name: (3) Download libspectrum artefact
        uses: actions/download-artifact@v8
        with:
          name: libspectrum-installed-linux-${{ inputs.libspectrum_key }}
          path: libspectrum

      - name: (4) Install libspectrum from artefact
        run: |
          # Extract (-x) files into /usr/local
          sudo tar --directory / -xvf libspectrum/libspectrum-installed-linux.tar
          sudo ldconfig
          echo "Done"

      - name: (5) Autogen.sh
        run: ./autogen.sh

      - name: (6) Configure for Linux
        run: |
          ./configure ${{ inputs.configure_params }} \
          2>&1 | tee ./configure.out

      - name: (7) Verify output from configure
        # Most of the tested strings are common for all Linux builds
        # Only the strings related to UI selection differ
        run: |          
          .github/scripts/in_config.sh "Fuse options"
          .github/scripts/in_config.sh "zlib support: yes"
          .github/scripts/in_config.sh "libxml2 support: yes"
          .github/scripts/in_config.sh "libpng support: yes"
          .github/scripts/in_config.sh "Spectranet support: yes"
          .github/scripts/in_config.sh "SpeccyBoot support: yes"
          .github/scripts/in_config.sh "TTX2000 S support: yes"
          .github/scripts/in_config.sh "TS-Pico support: yes"
          .github/scripts/in_config.sh "Desktop integration: no"
          
          .github/scripts/in_config.sh "User interface: ${{ inputs.verify_ui }}"
          .github/scripts/in_config.sh "Selected audio driver: ${{ inputs.verify_audio }}"
      - name: (7b) Verify additional configure output
        if: ${{ inputs.verify_other }}
        run: |
          .github/scripts/in_config.sh "${{ inputs.verify_other }}"

      - name: (8) Make
        run: make

      - name: (9) Install
        run: sudo make install

      - name: (9b) TS-Pico bridge test
        if: ${{ inputs.tspico_test }}
        run: python3 tspico/bridge_test.py ./fuse

      - name: (10) Run unit tests
        if: ${{ inputs.run_check }}
        run: make check

      - name: Optimized FIFO concurrency tests
        if: ${{ inputs.run_check }}
        run: sh .github/scripts/test_sfifo.sh optimized

      - name: Thread Sanitizer FIFO concurrency tests
        if: ${{ inputs.run_check }}
        run: sh .github/scripts/test_sfifo.sh tsan

      - name: (11) Finish
        run: |
          echo "🍏 Finishing with status ${{ job.status }}."
